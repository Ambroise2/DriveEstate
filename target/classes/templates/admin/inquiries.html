<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{admin/layout :: adminLayout(~{::title}, ~{::section})}">
<head><title>Inquiries — Admin</title></head>
<body><section>
<h5 style="font-weight:700;margin-bottom:1.25rem;">All Inquiries</h5>
<div class="card-box">
  <div class="table-responsive">
    <table class="table table-hover mb-0">
      <thead><tr><th>From</th><th>To</th><th>Listing</th><th>Message</th><th>Replied</th><th>Date</th></tr></thead>
      <tbody>
        <tr th:each="inq : ${inquiries}">
          <td style="font-size:.83rem;" th:text="${inq.sender.name}"></td>
          <td style="font-size:.83rem;" th:text="${inq.receiver.name}"></td>
          <td style="font-size:.78rem;"><a th:href="@{/admin/listings/{id}(id=${inq.listing.id})}" th:text="${#strings.abbreviate(inq.listing.title,30)}" style="color:#C9A84C;text-decoration:none;"></a></td>
          <td style="font-size:.78rem;color:#6B7280;" th:text="${#strings.abbreviate(inq.message,50)}"></td>
          <td><span th:if="${inq.reply != null}" style="color:#10B981;font-size:.8rem;">✓ Replied</span><span th:unless="${inq.reply != null}" style="color:#9CA3AF;font-size:.8rem;">Pending</span></td>
          <td style="font-size:.75rem;color:#9CA3AF;" th:text="${#temporals.format(inq.createdAt,'dd MMM')}"></td>
        </tr>
      </tbody>
    </table>
  </div>
  <nav th:if="${totalPages > 1}" class="mt-3">
    <ul class="pagination pagination-sm justify-content-center mb-0">
      <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'"><a class="page-link" th:href="@{/admin/inquiries(page=${currentPage-1})}">‹</a></li>
      <li th:each="i : ${#numbers.sequence(0,totalPages-1)}" class="page-item" th:classappend="${i==currentPage}?'active'"><a class="page-link" th:href="@{/admin/inquiries(page=${i})}" th:text="${i+1}"></a></li>
      <li class="page-item" th:classappend="${currentPage==totalPages-1}?'disabled'"><a class="page-link" th:href="@{/admin/inquiries(page=${currentPage+1})}">›</a></li>
    </ul>
  </nav>
</div>
</section></body>
</html>

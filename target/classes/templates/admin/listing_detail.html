<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{admin/layout :: adminLayout(~{::title}, ~{::section})}">
<head><title th:text="${listing.title + ' — Admin'}">Listing — Admin</title></head>
<body><section>
<div class="d-flex align-items-center gap-3 mb-4">
  <a th:href="@{/admin/listings}" class="btn btn-outline-secondary btn-sm"><i class="fa fa-arrow-left me-1"></i>Back</a>
  <h5 style="font-weight:700;margin:0;" th:text="${#strings.abbreviate(listing.title,50)}"></h5>
  <span class="badge px-2 py-1" th:text="${listing.status}"
        th:style="${listing.status.name() == 'ACTIVE'} ? 'background:#ECFDF5;color:#065F46;' : (${listing.status.name() == 'PENDING'} ? 'background:#FFF7ED;color:#9A3412;' : 'background:#FEF2F2;color:#991B1B;')"></span>
</div>

<div class="row g-4">
  <div class="col-lg-8">
    <!-- Listing Info -->
    <div class="card-box mb-3">
      <div class="d-flex justify-content-between mb-3">
        <div>
          <h6 style="font-weight:700;margin-bottom:.25rem;" th:text="${listing.title}"></h6>
          <div style="font-size:.85rem;color:#6B7280;"><i class="fa fa-map-marker-alt me-1" style="color:#C9A84C;"></i><span th:text="${listing.location + ', ' + listing.county}"></span></div>
        </div>
        <div style="font-size:1.6rem;font-weight:700;color:#C9A84C;" th:text="${listing.formattedPrice}"></div>
      </div>

      <!-- Specs -->
      <div class="row g-2 mb-3">
        <div th:if="${listing.listingType.name() == 'CAR'}" class="col-12">
          <div class="row g-2">
            <div class="col-4 col-md-2" th:each="spec : ${ { {listing.make,'Make'},{listing.model,'Model'},{listing.year,'Year'},{listing.mileage,'KM'},{listing.fuelType,'Fuel'},{listing.transmission,'Trans.'} } }" th:if="${spec[0] != null}">
              <div style="background:#F8F9FB;border-radius:8px;padding:.5rem;text-align:center;font-size:.78rem;">
                <div style="color:#9CA3AF;font-size:.65rem;" th:text="${spec[1]}"></div>
                <div style="font-weight:600;" th:text="${spec[0]}"></div>
              </div>
            </div>
          </div>
        </div>
        <div th:if="${listing.listingType.name() == 'LAND'}" class="col-12">
          <div class="row g-2">
            <div th:if="${listing.sizeAcres != null}" class="col-4 col-md-2"><div style="background:#F8F9FB;border-radius:8px;padding:.5rem;text-align:center;font-size:.78rem;"><div style="color:#9CA3AF;font-size:.65rem;">Size</div><div style="font-weight:600;" th:text="${listing.sizeAcres + ' Acres'}"></div></div></div>
            <div th:if="${listing.zoning != null}" class="col-4 col-md-2"><div style="background:#F8F9FB;border-radius:8px;padding:.5rem;text-align:center;font-size:.78rem;"><div style="color:#9CA3AF;font-size:.65rem;">Zoning</div><div style="font-weight:600;" th:text="${listing.zoning}"></div></div></div>
          </div>
        </div>
      </div>

      <p style="font-size:.88rem;color:#374151;line-height:1.75;" th:text="${listing.description}"></p>

      <div class="d-flex gap-2 flex-wrap mt-2">
        <span th:if="${listing.featured}" class="badge" style="background:#FFFBEB;color:#92400E;border:1px solid #FCD34D;">⭐ Featured</span>
        <span th:if="${listing.verified}" class="badge" style="background:#ECFDF5;color:#065F46;border:1px solid #A7F3D0;">✓ Verified</span>
        <span th:if="${listing.negotiable}" class="badge" style="background:#EDE9FE;color:#5B21B6;border:1px solid #C4B5FD;">💬 Negotiable</span>
        <span th:if="${listing.installmentAvailable}" class="badge" style="background:#F0F9FF;color:#0369A1;border:1px solid #BAE6FD;">📆 Installment</span>
      </div>
    </div>

    <!-- Inquiries -->
    <div class="card-box">
      <h6 style="font-weight:700;margin-bottom:.75rem;">Inquiries (<span th:text="${inquiries.size()}"></span>)</h6>
      <div th:if="${inquiries.isEmpty()}" style="font-size:.85rem;color:#9CA3AF;">No inquiries yet</div>
      <div th:each="inq : ${inquiries}" style="padding:.65rem 0;border-bottom:1px solid #F3F4F6;font-size:.82rem;">
        <div style="font-weight:600;" th:text="${inq.sender.name + ' → ' + inq.receiver.name}"></div>
        <div style="color:#374151;margin:.2rem 0;" th:text="${inq.message}"></div>
        <div th:if="${inq.reply != null}" style="color:#065F46;font-size:.78rem;">Reply: <span th:text="${inq.reply}"></span></div>
        <div style="color:#9CA3AF;font-size:.72rem;" th:text="${#temporals.format(inq.createdAt,'dd MMM yyyy HH:mm')}"></div>
      </div>
    </div>
  </div>

  <!-- Admin Actions -->
  <div class="col-lg-4">
    <!-- Seller Info -->
    <div class="card-box mb-3">
      <h6 style="font-weight:700;margin-bottom:.75rem;">Seller</h6>
      <div style="font-weight:600;" th:text="${listing.seller.name}"></div>
      <div style="font-size:.82rem;color:#6B7280;" th:text="${listing.seller.email}"></div>
      <div style="font-size:.82rem;color:#6B7280;" th:text="${listing.seller.phone}"></div>
      <a th:href="@{/admin/users/{id}(id=${listing.seller.id})}" class="btn btn-outline-secondary btn-sm w-100 mt-2" style="font-size:.78rem;">View Seller Profile</a>
    </div>

    <!-- Actions -->
    <div class="card-box">
      <h6 style="font-weight:700;margin-bottom:1rem;">Admin Actions</h6>

      <!-- Approve -->
      <div th:if="${listing.status.name() == 'PENDING'}" class="mb-3">
        <form method="POST" th:action="@{/admin/listings/{id}/approve(id=${listing.id})}">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
          <input type="text" name="notes" class="form-control form-control-sm mb-2" placeholder="Optional notes…">
          <button type="submit" class="btn btn-sm w-100" style="background:#ECFDF5;color:#065F46;border:1px solid #A7F3D0;font-weight:600;">✅ Approve &amp; Publish</button>
        </form>
      </div>

      <!-- Reject -->
      <div th:if="${listing.status.name() == 'PENDING'}" class="mb-3">
        <form method="POST" th:action="@{/admin/listings/{id}/reject(id=${listing.id})}">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
          <input type="text" name="reason" class="form-control form-control-sm mb-2" placeholder="Rejection reason…">
          <button type="submit" class="btn btn-sm w-100" style="background:#FEF2F2;color:#991B1B;border:1px solid #FECACA;font-weight:600;">✗ Reject Listing</button>
        </form>
      </div>

      <div class="d-flex flex-column gap-2">
        <form method="POST" th:action="@{/admin/listings/{id}/toggle-feature(id=${listing.id})}">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
          <button type="submit" class="btn btn-sm btn-outline-secondary w-100" th:text="${listing.featured ? '★ Remove Feature' : '⭐ Mark Featured'}"></button>
        </form>
        <form method="POST" th:action="@{/admin/listings/{id}/toggle-verify(id=${listing.id})}">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
          <button type="submit" class="btn btn-sm btn-outline-secondary w-100" th:text="${listing.verified ? 'Remove Verification' : '✓ Verify Listing'}"></button>
        </form>
        <form method="POST" th:action="@{/admin/listings/{id}/mark-sold(id=${listing.id})}">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
          <button type="submit" class="btn btn-sm btn-outline-secondary w-100">Mark as Sold</button>
        </form>
        <form method="POST" th:action="@{/admin/listings/{id}/delete(id=${listing.id})}" onsubmit="return confirm('Permanently delete this listing?')">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
          <button type="submit" class="btn btn-sm btn-danger w-100">🗑 Delete Listing</button>
        </form>
      </div>
    </div>
  </div>
</div>
</section></body>
</html>

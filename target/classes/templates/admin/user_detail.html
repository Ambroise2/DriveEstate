<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{admin/layout :: adminLayout(~{::title}, ~{::section})}">
<head><title th:text="${user.name + ' — Admin'}">User — Admin</title></head>
<body><section>
<div class="d-flex align-items-center gap-3 mb-4">
  <a th:href="@{/admin/users}" class="btn btn-outline-secondary btn-sm"><i class="fa fa-arrow-left me-1"></i>Back</a>
  <h5 style="font-weight:700;margin:0;" th:text="${user.name}"></h5>
  <span th:if="${user.verified}" class="badge" style="background:#ECFDF5;color:#065F46;border:1px solid #A7F3D0;">✓ Verified</span>
  <span th:unless="${user.active}" class="badge bg-danger">Suspended</span>
</div>
<div class="row g-4">
  <div class="col-lg-4">
    <div class="card-box text-center mb-3">
      <div style="width:60px;height:60px;border-radius:50%;background:linear-gradient(135deg,#C9A84C,#E8C97A);display:flex;align-items:center;justify-content:center;font-size:1.8rem;font-weight:700;color:#0A1628;margin:0 auto .75rem;" th:text="${user.initial}"></div>
      <div style="font-weight:700;" th:text="${user.name}"></div>
      <div style="font-size:.82rem;color:#6B7280;" th:text="${user.email}"></div>
      <div style="font-size:.82rem;color:#6B7280;" th:text="${user.phone}"></div>
      <div style="font-size:.78rem;color:#9CA3AF;margin-top:.5rem;">Member since <span th:text="${#temporals.format(user.createdAt,'dd MMM yyyy')}"></span></div>
      <div class="d-flex flex-column gap-2 mt-3">
        <form method="POST" th:action="@{/admin/users/{id}/toggle-active(id=${user.id})}">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
          <button type="submit" class="btn btn-sm w-100" th:classappend="${user.active} ? 'btn-outline-danger' : 'btn-outline-success'" th:text="${user.active ? 'Suspend Account' : 'Activate Account'}"></button>
        </form>
        <form method="POST" th:action="@{/admin/users/{id}/toggle-verify(id=${user.id})}">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
          <button type="submit" class="btn btn-sm w-100 btn-outline-secondary" th:text="${user.verified ? 'Remove Verification' : 'Verify Account'}"></button>
        </form>
        <form method="POST" th:action="@{/admin/users/{id}/delete(id=${user.id})}" onsubmit="return confirm('Permanently delete this user and all their data?')">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
          <button type="submit" class="btn btn-sm btn-danger w-100">Delete User</button>
        </form>
      </div>
    </div>
  </div>
  <div class="col-lg-8">
    <div class="card-box mb-3">
      <h6 style="font-weight:700;margin-bottom:.75rem;">Listings (<span th:text="${listings.size()}"></span>)</h6>
      <div th:if="${listings.isEmpty()}" style="font-size:.85rem;color:#9CA3AF;">No listings</div>
      <table th:unless="${listings.isEmpty()}" class="table table-sm table-hover mb-0" style="font-size:.82rem;">
        <thead><tr><th>Title</th><th>Price</th><th>Status</th><th>Views</th><th></th></tr></thead>
        <tbody>
          <tr th:each="l : ${listings}">
            <td th:text="${#strings.abbreviate(l.title,38)}"></td>
            <td th:text="${l.formattedPrice}"></td>
            <td><span class="badge" th:text="${l.status}" th:classappend="'badge-status-' + ${l.status.name().toLowerCase()}"></span></td>
            <td th:text="${l.views}"></td>
            <td><a th:href="@{/admin/listings/{id}(id=${l.id})}" class="btn btn-sm btn-outline-secondary" style="font-size:.7rem;">View</a></td>
          </tr>
        </tbody>
      </table>
    </div>
    <div class="card-box">
      <h6 style="font-weight:700;margin-bottom:.75rem;">Activity Log</h6>
      <div th:each="log : ${logs}" style="padding:.4rem 0;border-bottom:1px solid #F3F4F6;font-size:.8rem;">
        <span style="font-weight:600;color:#374151;" th:text="${log.action}"></span>
        <span style="color:#9CA3AF;margin-left:.5rem;" th:text="${#temporals.format(log.createdAt,'dd MMM HH:mm')}"></span>
        <div style="color:#6B7280;font-size:.75rem;" th:if="${log.details}" th:text="${log.details}"></div>
      </div>
    </div>
  </div>
</div>
</section></body>
</html>

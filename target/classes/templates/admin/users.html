<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{admin/layout :: adminLayout(~{::title}, ~{::section})}">
<head><title>Users — Admin</title></head>
<body><section>
<div class="d-flex justify-content-between align-items-center mb-3">
  <h5 style="font-weight:700;margin:0;">All Users</h5>
  <form method="GET" th:action="@{/admin/users}" class="d-flex gap-2">
    <input type="text" name="q" class="form-control form-control-sm" placeholder="Search name or email…" th:value="${q}" style="width:240px;">
    <button type="submit" class="btn btn-gold btn-sm">Search</button>
  </form>
</div>
<div class="card-box">
  <div class="table-responsive">
    <table class="table table-hover mb-0">
      <thead><tr><th>User</th><th>Phone</th><th>County</th><th>Listings</th><th>Verified</th><th>Active</th><th>Joined</th><th>Actions</th></tr></thead>
      <tbody>
        <tr th:each="u : ${users}">
          <td>
            <div style="font-weight:600;font-size:.85rem;" th:text="${u.name}"></div>
            <div style="font-size:.72rem;color:#9CA3AF;" th:text="${u.email}"></div>
          </td>
          <td style="font-size:.82rem;" th:text="${u.phone}"></td>
          <td style="font-size:.82rem;" th:text="${u.county ?: '—'}"></td>
          <td style="font-size:.82rem;" th:text="${u.activeListingCount}"></td>
          <td><span th:if="${u.verified}" style="color:#10B981;">✓</span><span th:unless="${u.verified}" style="color:#D1D5DB;">—</span></td>
          <td><span th:if="${u.active}" style="color:#10B981;">✓</span><span th:unless="${u.active}" style="color:#EF4444;">✗</span></td>
          <td style="font-size:.78rem;color:#9CA3AF;" th:text="${#temporals.format(u.createdAt,'dd MMM yyyy')}"></td>
          <td>
            <a th:href="@{/admin/users/{id}(id=${u.id})}" class="btn btn-sm btn-outline-secondary" style="font-size:.72rem;">View</a>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
</section></body>
</html>

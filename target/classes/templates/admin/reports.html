<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{admin/layout :: adminLayout(~{::title}, ~{::section})}">
<head><title>Reports — Admin</title></head>
<body><section>

<h5 style="font-weight:700;margin-bottom:1.25rem;">Reports &amp; Analytics</h5>

<div class="row g-4">

  <!-- County Stats -->
  <div class="col-lg-6">
    <div class="card-box">
      <h6 style="font-weight:700;margin-bottom:1rem;">Top Counties by Listings</h6>
      <div th:if="${countyStats == null or #lists.isEmpty(countyStats)}"
           style="color:#9CA3AF;font-size:.85rem;text-align:center;padding:1rem;">
        No data yet
      </div>
      <div th:unless="${countyStats == null or #lists.isEmpty(countyStats)}">
        <div th:each="row,i : ${countyStats}" style="margin-bottom:.6rem;">
          <div class="d-flex justify-content-between" style="font-size:.82rem;margin-bottom:.2rem;">
            <span th:text="${row[0]}">County</span>
            <span style="font-weight:600;" th:text="${row[1]}">0</span>
          </div>
          <div style="background:#F3F4F6;border-radius:4px;height:7px;">
            <div th:style="'width:' + (i.index == 0 ? '100' : '60') + '%;background:#C9A84C;border-radius:4px;height:7px;'"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Price Ranges -->
  <div class="col-lg-6">
    <div class="card-box">
      <h6 style="font-weight:700;margin-bottom:1rem;">Car Price Distribution (KES)</h6>
      <div th:if="${priceRanges == null or #maps.isEmpty(priceRanges)}"
           style="color:#9CA3AF;font-size:.85rem;text-align:center;padding:1rem;">
        No data yet
      </div>
      <div th:unless="${priceRanges == null or #maps.isEmpty(priceRanges)}">
        <div th:each="entry : ${priceRanges}" style="margin-bottom:.6rem;">
          <div class="d-flex justify-content-between" style="font-size:.82rem;margin-bottom:.2rem;">
            <span th:text="${entry.key}">Range</span>
            <span style="font-weight:600;" th:text="${entry.value}">0</span>
          </div>
          <div style="background:#F3F4F6;border-radius:4px;height:7px;">
            <div th:style="'width:' + (${entry.value} > 0 ? '65' : '5') + '%;background:#3B82F6;border-radius:4px;height:7px;'"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Fuel Type Chart -->
  <div class="col-lg-6">
    <div class="card-box">
      <h6 style="font-weight:700;margin-bottom:1rem;">Cars by Fuel Type</h6>
      <canvas id="fuelChart" height="180"></canvas>
    </div>
  </div>

  <!-- Top Sellers -->
  <div class="col-lg-6">
    <div class="card-box">
      <h6 style="font-weight:700;margin-bottom:.75rem;">Most Active Sellers</h6>
      <div th:if="${topSellers == null or #lists.isEmpty(topSellers)}"
           style="color:#9CA3AF;font-size:.85rem;text-align:center;padding:1rem;">
        No sellers yet
      </div>
      <table th:unless="${topSellers == null or #lists.isEmpty(topSellers)}"
             class="table table-sm mb-0" style="font-size:.82rem;">
        <thead>
          <tr><th>#</th><th>Seller</th><th>County</th><th>Listings</th></tr>
        </thead>
        <tbody>
          <tr th:each="u,i : ${topSellers}">
            <td th:text="${i.index + 1}" style="font-weight:600;color:#9CA3AF;"></td>
            <td>
              <div style="font-weight:600;" th:text="${u.name}"></div>
              <div style="font-size:.72rem;color:#9CA3AF;" th:text="${u.email}"></div>
            </td>
            <td th:text="${u.county != null ? u.county : '—'}"></td>
            <td style="font-weight:600;color:#C9A84C;" th:text="${u.activeListingCount}"></td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script th:inline="javascript">
/*<![CDATA[*/
var rawFuel = /*[[${fuelStats}]]*/ [];
var fuelLabels = [];
var fuelData = [];
if (rawFuel && rawFuel.length) {
  rawFuel.forEach(function(row) {
    fuelLabels.push(row[0] || 'Unknown');
    fuelData.push(Number(row[1]) || 0);
  });
}
if (fuelLabels.length > 0) {
  new Chart(document.getElementById('fuelChart'), {
    type: 'doughnut',
    data: {
      labels: fuelLabels,
      datasets: [{
        data: fuelData,
        backgroundColor: ['#C9A84C','#3B82F6','#10B981','#EF4444','#8B5CF6'],
        borderWidth: 2
      }]
    },
    options: {
      responsive: true,
      plugins: { legend: { position: 'right' } }
    }
  });
} else {
  document.getElementById('fuelChart').parentElement.innerHTML +=
    '<p style="text-align:center;color:#9CA3AF;font-size:.85rem;">No fuel data yet</p>';
}
/*]]>*/
</script>

</section></body>
</html>

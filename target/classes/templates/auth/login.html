<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — DriveEstate</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;700&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  body{font-family:'Outfit',sans-serif;background:linear-gradient(135deg,#0A1628 0%,#1E3160 100%);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:2rem 1rem;}
  .card{border:none;border-radius:20px;box-shadow:0 30px 80px rgba(0,0,0,0.4);padding:2.5rem;max-width:420px;width:100%;}
  .brand{font-family:'Cormorant Garamond',serif;font-size:2rem;font-weight:700;color:#C9A84C;text-align:center;}
  .btn-gold{background:#C9A84C;color:#0A1628;font-weight:700;border:none;border-radius:10px;padding:0.75rem;width:100%;transition:all .2s;}
  .btn-gold:hover{background:#E8C97A;color:#0A1628;transform:translateY(-1px);}
  .form-control:focus{border-color:#C9A84C;box-shadow:0 0 0 3px rgba(201,168,76,.15);}
  .demo-box{background:#F8F9FB;border-radius:10px;padding:0.7rem 1rem;font-size:0.8rem;margin-bottom:0.5rem;}
</style>
</head>
<body>
<div class="card">
  <div class="brand">DriveEstate</div>
  <p style="text-align:center;color:#6B7280;font-size:0.85rem;margin-bottom:1.5rem;">Kenya's Premier Cars &amp; Land Marketplace</p>

  <div th:if="${loginError}" class="alert alert-danger py-2 mb-3" th:text="${loginError}"></div>
  <div th:if="${logoutMsg}" class="alert alert-success py-2 mb-3" th:text="${logoutMsg}"></div>
  <div th:if="${param.error}" class="alert alert-danger py-2 mb-3">Invalid email or password.</div>
  <div th:if="${param.logout}" class="alert alert-info py-2 mb-3">You have been logged out.</div>

  <form method="POST" th:action="@{/auth/login}">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
    <div class="mb-3">
      <label class="form-label fw-500" style="font-size:.85rem;">Email Address</label>
      <input type="email" name="email" class="form-control" placeholder="you@example.com" required autofocus>
    </div>
    <div class="mb-3">
      <div class="d-flex justify-content-between">
        <label class="form-label fw-500" style="font-size:.85rem;">Password</label>
        <a href="#" style="font-size:.78rem;color:#C9A84C;text-decoration:none;">Forgot password?</a>
      </div>
      <input type="password" name="password" class="form-control" placeholder="••••••••" required>
    </div>
    <div class="form-check mb-3">
      <input class="form-check-input" type="checkbox" name="remember" id="remember">
      <label class="form-check-label" for="remember" style="font-size:.82rem;">Remember me for 30 days</label>
    </div>
    <button type="submit" class="btn btn-gold">Sign In</button>
  </form>

  <div style="text-align:center;color:#9CA3AF;font-size:.8rem;margin:1rem 0;position:relative;">
    <span style="background:white;padding:0 0.5rem;position:relative;z-index:1;">Demo Accounts</span>
    <hr style="position:absolute;top:50%;width:100%;left:0;border-color:#E5E7EB;margin:0;">
  </div>

  <div class="demo-box">
    <div style="color:#6B7280;margin-bottom:2px;">🔑 Admin:</div>
    <code style="color:#C9A84C;">admin@driveestate.co.ke / Admin@1234</code>
  </div>
  <div class="demo-box">
    <div style="color:#6B7280;margin-bottom:2px;">🧑 Seller:</div>
    <code style="color:#374151;">james@example.com / Password@123</code>
  </div>

  <p style="text-align:center;font-size:.875rem;color:#6B7280;margin-top:1.25rem;margin-bottom:0;">
    New here? <a th:href="@{/auth/register}" style="color:#C9A84C;font-weight:600;text-decoration:none;">Create free account →</a>
  </p>
</div>
</body>
</html>

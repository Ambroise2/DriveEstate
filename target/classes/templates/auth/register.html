<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Register — DriveEstate</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@700&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  body{font-family:'Outfit',sans-serif;background:linear-gradient(135deg,#0A1628,#1E3160);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:2rem 1rem;}
  .card{border:none;border-radius:20px;box-shadow:0 30px 80px rgba(0,0,0,.4);padding:2.5rem;max-width:480px;width:100%;}
  .brand{font-family:'Cormorant Garamond',serif;font-size:2rem;font-weight:700;color:#C9A84C;text-align:center;}
  .btn-gold{background:#C9A84C;color:#0A1628;font-weight:700;border:none;border-radius:10px;padding:.75rem;width:100%;}
  .btn-gold:hover{background:#E8C97A;color:#0A1628;}
  .form-control:focus,.form-select:focus{border-color:#C9A84C;box-shadow:0 0 0 3px rgba(201,168,76,.15);}
  label{font-size:.85rem;font-weight:500;}
</style>
</head>
<body>
<div class="card">
  <div class="brand">DriveEstate</div>
  <p style="text-align:center;color:#6B7280;font-size:.85rem;margin-bottom:1.5rem;">Create your free account</p>

  <div th:if="${error}" class="alert alert-danger py-2" th:text="${error}"></div>
  <div th:if="${success}" class="alert alert-success py-2" th:text="${success}"></div>

  <form method="POST" th:action="@{/auth/register}">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
    <div class="row g-3">
      <div class="col-12">
        <label>Full Name *</label>
        <input type="text" name="name" class="form-control" placeholder="James Mwangi" required>
      </div>
      <div class="col-12">
        <label>Email Address *</label>
        <input type="email" name="email" class="form-control" placeholder="james@example.com" required>
      </div>
      <div class="col-md-6">
        <label>Phone Number *</label>
        <input type="tel" name="phone" class="form-control" placeholder="+254712345678" required>
      </div>
      <div class="col-md-6">
        <label>County</label>
        <select name="county" class="form-select">
          <option value="">— Select —</option>
          <option th:each="c : ${ {'Nairobi','Mombasa','Nakuru','Kisumu','Eldoret','Uasin Gishu','Thika','Machakos','Nyeri','Kisii','Meru','Kakamega','Kilifi','Kajiado','Kiambu'} }" th:value="${c}" th:text="${c}"></option>
        </select>
      </div>
      <div class="col-md-6">
        <label>Password *</label>
        <input type="password" name="password" class="form-control" placeholder="Min 8 characters" required minlength="8">
      </div>
      <div class="col-md-6">
        <label>Confirm Password *</label>
        <input type="password" name="confirmPassword" class="form-control" placeholder="Repeat password" required>
      </div>
      <div class="col-12">
        <div class="form-check">
          <input class="form-check-input" type="checkbox" id="terms" required>
          <label class="form-check-label" for="terms" style="font-size:.8rem;">I agree to the <a href="#" style="color:#C9A84C;">Terms of Service</a> and <a href="#" style="color:#C9A84C;">Privacy Policy</a></label>
        </div>
      </div>
      <div class="col-12">
        <button type="submit" class="btn btn-gold">Create Account</button>
      </div>
    </div>
  </form>
  <p style="text-align:center;font-size:.875rem;color:#6B7280;margin-top:1.25rem;margin-bottom:0;">
    Already have an account? <a th:href="@{/auth/login}" style="color:#C9A84C;font-weight:600;text-decoration:none;">Sign in →</a>
  </p>
</div>
</body>
</html>

<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{client/layout :: layout(~{::title}, ~{::main})}">
<head><title>My Profile — DriveEstate</title></head>
<body><main>
<div class="page-hdr"><div class="container-fluid px-4"><h1 style="font-size:1.85rem;">👤 My Profile</h1></div></div>
<div class="container-fluid px-4 pb-5" style="max-width:700px;">
  <div style="background:#fff;border-radius:16px;padding:2rem;box-shadow:0 2px 12px rgba(0,0,0,.08);">
    <div class="text-center mb-4">
      <div style="width:72px;height:72px;border-radius:50%;background:linear-gradient(135deg,#C9A84C,#E8C97A);display:flex;align-items:center;justify-content:center;font-size:2rem;font-weight:700;color:#0A1628;margin:0 auto 0.75rem;" sec:authentication="principal.initial"></div>
      <div style="font-weight:700;font-size:1.1rem;" sec:authentication="principal.name"></div>
      <div style="font-size:.82rem;color:#6B7280;" sec:authentication="principal.email"></div>
    </div>

    <form method="POST" th:action="@{/profile}">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
      <div class="row g-3">
        <div class="col-md-6">
          <label>Full Name *</label>
          <input type="text" name="name" class="form-control" required sec:authentication="principal.name">
        </div>
        <div class="col-md-6">
          <label>Phone Number *</label>
          <input type="tel" name="phone" class="form-control" required sec:authentication="principal.phone">
        </div>
        <div class="col-md-6">
          <label>Email (cannot change)</label>
          <input type="email" class="form-control" disabled sec:authentication="principal.email">
        </div>
        <div class="col-md-6">
          <label>County</label>
          <select name="county" class="form-select">
            <option value="">— Select —</option>
            <option th:each="c : ${counties}" th:value="${c}" th:text="${c}"></option>
          </select>
        </div>
        <div class="col-12">
          <label>Bio</label>
          <textarea name="bio" class="form-control" rows="3" placeholder="Tell buyers about yourself…" sec:authentication="principal.bio"></textarea>
        </div>
        <div class="col-12"><hr><h6 style="font-weight:700;color:#9CA3AF;font-size:.75rem;text-transform:uppercase;letter-spacing:1px;">Change Password (optional)</h6></div>
        <div class="col-md-6">
          <label>New Password</label>
          <input type="password" name="newPassword" class="form-control" placeholder="Leave blank to keep current" minlength="8">
        </div>
        <div class="col-md-6">
          <label>Confirm New Password</label>
          <input type="password" name="confirmPassword" class="form-control" placeholder="Repeat new password">
        </div>
        <div class="col-12">
          <button type="submit" class="btn btn-gold w-100">Save Changes</button>
        </div>
      </div>
    </form>
  </div>
</div>
</main></body>
</html>

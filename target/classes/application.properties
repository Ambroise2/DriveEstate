spring.application.name=DriveEstate

# ── H2 Embedded Database (persists to file) ──────────────────────────────────
spring.datasource.url=jdbc:h2:file:./driveestate-db;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# ── H2 Console (access at /h2-console) ───────────────────────────────────────
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# ── Thymeleaf ─────────────────────────────────────────────────────────────────
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# ── Server ────────────────────────────────────────────────────────────────────
server.port=8080
server.error.whitelabel.enabled=false

# ── File Upload ───────────────────────────────────────────────────────────────
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB

# ── App Info ──────────────────────────────────────────────────────────────────
app.name=DriveEstate
app.tagline=Kenya's Premier Cars & Land Marketplace
app.support.email=support@driveestate.co.ke
app.support.phone=+254 700 000 000

<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{client/layout :: layout(~{::title}, ~{::main})}">
<head><title th:text="${edit ? 'Edit Listing' : 'Post a Listing'} + ' — DriveEstate'">Post — DriveEstate</title></head>
<body><main>
<div class="page-hdr"><div class="container-fluid px-4">
  <h1 style="font-size:1.85rem;" th:text="${edit ? '✏️ Edit Listing' : '➕ Post a New Listing'}"></h1>
  <p class="mb-0" style="color:rgba(255,255,255,.7);">Fill in the details. Our team reviews within 24 hours.</p>
</div></div>

<div class="container-fluid px-4 pb-5" style="max-width:900px;">
  <form method="POST" th:action="${edit ? '/listing/' + listing.id + '/edit' : '/post-listing'}">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

    <!-- Type Selector (new only) -->
    <div th:unless="${edit}" style="background:var(--bg3);border-radius:14px;padding:1.5rem;margin-bottom:1.25rem;box-shadow:0 2px 10px rgba(0,0,0,.06);">
      <h6 style="font-weight:700;margin-bottom:1rem;">What are you listing?</h6>
      <div class="row g-3">
        <div class="col-md-6">
          <label id="carCard" onclick="selectType('car')" style="border:2px solid #C9A84C;border-radius:12px;padding:1.25rem;text-align:center;cursor:pointer;background:#FFFBEB;display:block;">
            <input type="radio" name="listingType" value="car" hidden checked><div style="font-size:2.5rem;">🚗</div>
            <div style="font-weight:700;margin-top:.4rem;">Car / Vehicle</div><div style="font-size:.8rem;color:var(--text2);">Sell your car fast</div>
          </label>
        </div>
        <div class="col-md-6">
          <label id="landCard" onclick="selectType('land')" style="border:2px solid #e5e7eb;border-radius:12px;padding:1.25rem;text-align:center;cursor:pointer;background:#F9FAFB;display:block;">
            <input type="radio" name="listingType" value="land" hidden><div style="font-size:2.5rem;">🌍</div>
            <div style="font-weight:700;margin-top:.4rem;">Land / Property</div><div style="font-size:.8rem;color:var(--text2);">List your plot or land</div>
          </label>
        </div>
      </div>
    </div>
    <input th:if="${edit}" type="hidden" name="listingType" th:value="${listing.listingType.name().toLowerCase()}">

    <!-- Basic Info -->
    <div style="background:var(--bg3);border-radius:14px;padding:1.5rem;margin-bottom:1.25rem;box-shadow:0 2px 10px rgba(0,0,0,.06);">
      <h6 style="font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--text2);margin-bottom:1rem;">Basic Information</h6>
      <div class="row g-3">
        <div class="col-12">
          <label>Listing Title *</label>
          <input type="text" name="title" class="form-control" placeholder="e.g. 2022 Toyota Land Cruiser — Karen, Nairobi"
                 th:value="${edit ? listing.title : ''}" required>
        </div>
        <div class="col-md-6">
          <label>Price (KES) *</label>
          <input type="number" name="price" class="form-control" placeholder="5500000"
                 th:value="${edit ? listing.price : ''}" required>
        </div>
        <div class="col-md-6">
          <label>Category</label>
          <select name="categoryId" class="form-select">
            <option value="">— Select Category —</option>
            <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.icon + ' ' + cat.name}"
                    th:selected="${edit and listing.category != null and listing.category.id == cat.id}"></option>
          </select>
        </div>
        <div class="col-md-6">
          <label>Location / Area *</label>
          <input type="text" name="location" class="form-control" placeholder="Westlands, Nairobi"
                 th:value="${edit ? listing.location : ''}" required>
        </div>
        <div class="col-md-6">
          <label>County *</label>
          <select name="county" class="form-select" required>
            <option value="">— Select County —</option>
            <option th:each="c : ${counties}" th:value="${c}" th:text="${c}"
                    th:selected="${edit and listing.county == c}"></option>
          </select>
        </div>
      </div>
    </div>

    <!-- Car Fields -->
    <div id="carFields" th:style="${edit and listing.listingType.name() == 'LAND'} ? 'display:none;' : ''"
         style="background:var(--bg3);border-radius:14px;padding:1.5rem;margin-bottom:1.25rem;box-shadow:0 2px 10px rgba(0,0,0,.06);">
      <h6 style="font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--text2);margin-bottom:1rem;">🚗 Vehicle Details</h6>
      <div class="row g-3">
        <div class="col-md-6"><label>Make / Brand</label><input type="text" name="make" class="form-control" placeholder="Toyota, BMW, Mercedes…" th:value="${edit ? listing.make : ''}"></div>
        <div class="col-md-6"><label>Model</label><input type="text" name="model" class="form-control" placeholder="Land Cruiser, X5, GLE…" th:value="${edit ? listing.model : ''}"></div>
        <div class="col-md-4"><label>Year</label><input type="number" name="year" class="form-control" placeholder="2022" min="1990" max="2025" th:value="${edit ? listing.year : ''}"></div>
        <div class="col-md-4"><label>Mileage (km)</label><input type="number" name="mileage" class="form-control" placeholder="50000" th:value="${edit ? listing.mileage : ''}"></div>
        <div class="col-md-4"><label>Engine (cc)</label><input type="number" name="engineCc" class="form-control" placeholder="2000" th:value="${edit ? listing.engineCc : ''}"></div>
        <div class="col-md-4"><label>Fuel Type</label>
          <select name="fuelType" class="form-select">
            <option th:each="f : ${ {'Petrol','Diesel','Electric','Hybrid','LPG'} }" th:value="${f}" th:text="${f}" th:selected="${edit and listing.fuelType == f}"></option>
          </select>
        </div>
        <div class="col-md-4"><label>Transmission</label>
          <select name="transmission" class="form-select">
            <option th:each="t : ${ {'Automatic','Manual','CVT','DSG'} }" th:value="${t}" th:text="${t}" th:selected="${edit and listing.transmission == t}"></option>
          </select>
        </div>
        <div class="col-md-4"><label>Condition</label>
          <select name="condition" class="form-select">
            <option value="used" th:selected="${edit and listing.condition == 'used'}">Used</option>
            <option value="new" th:selected="${edit and listing.condition == 'new'}">Brand New</option>
          </select>
        </div>
        <div class="col-md-4"><label>Color</label><input type="text" name="color" class="form-control" placeholder="Pearl White…" th:value="${edit ? listing.color : ''}"></div>
        <div class="col-md-4"><label>Drive Type</label>
          <select name="driveType" class="form-select">
            <option value="">— Select —</option>
            <option th:each="d : ${ {'2WD','4WD','AWD'} }" th:value="${d}" th:text="${d}" th:selected="${edit and listing.driveType == d}"></option>
          </select>
        </div>
        <div class="col-md-2"><label>Doors</label><input type="number" name="doors" class="form-control" min="2" max="6" th:value="${edit ? listing.doors : ''}"></div>
        <div class="col-md-2"><label>Seats</label><input type="number" name="seats" class="form-control" min="1" max="15" th:value="${edit ? listing.seats : ''}"></div>
      </div>
    </div>

    <!-- Land Fields -->
    <div id="landFields" th:style="${edit and listing.listingType.name() == 'CAR'} ? 'display:none;' : (${!edit} ? 'display:none;' : '')"
         style="background:var(--bg3);border-radius:14px;padding:1.5rem;margin-bottom:1.25rem;box-shadow:0 2px 10px rgba(0,0,0,.06);">
      <h6 style="font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--text2);margin-bottom:1rem;">🌍 Land Details</h6>
      <div class="row g-3">
        <div class="col-md-4"><label>Size (Acres)</label><input type="number" name="sizeAcres" class="form-control" step="0.01" placeholder="0.5" th:value="${edit ? listing.sizeAcres : ''}"></div>
        <div class="col-md-4"><label>Zoning</label>
          <select name="zoning" class="form-select">
            <option value="">— Select —</option>
            <option th:each="z : ${ {'Residential','Commercial','Agricultural','Industrial','Mixed Use'} }" th:value="${z}" th:text="${z}" th:selected="${edit and listing.zoning == z}"></option>
          </select>
        </div>
        <div class="col-md-4"><label>Road Access</label>
          <select name="roadAccess" class="form-select">
            <option th:each="r : ${ {'Tarmac','Murram','Gravel','None'} }" th:value="${r}" th:text="${r}" th:selected="${edit and listing.roadAccess == r}"></option>
          </select>
        </div>
        <div class="col-md-4"><label>Title Type</label>
          <select name="titleType" class="form-select">
            <option th:each="t : ${ {'Freehold','Leasehold 99yrs','Leasehold 45yrs','Allotment Letter'} }" th:value="${t}" th:text="${t}" th:selected="${edit and listing.titleType == t}"></option>
          </select>
        </div>
        <div class="col-md-8">
          <label>Utilities</label>
          <div class="d-flex gap-4 mt-1">
            <div class="form-check"><input class="form-check-input" type="checkbox" name="waterAvailable" id="water" th:checked="${edit and listing.waterAvailable}"><label class="form-check-label" for="water">💧 Water</label></div>
            <div class="form-check"><input class="form-check-input" type="checkbox" name="electricityAvailable" id="elec" th:checked="${edit and listing.electricityAvailable}"><label class="form-check-label" for="elec">⚡ Electricity</label></div>
            <div class="form-check"><input class="form-check-input" type="checkbox" name="fenced" id="fenced" th:checked="${edit and listing.fenced}"><label class="form-check-label" for="fenced">🚧 Fenced</label></div>
          </div>
        </div>
      </div>
    </div>

    <!-- Description -->
    <div style="background:var(--bg3);border-radius:14px;padding:1.5rem;margin-bottom:1.25rem;box-shadow:0 2px 10px rgba(0,0,0,.06);">
      <div class="d-flex justify-content-between align-items-center mb-2">
        <h6 style="font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--text2);margin:0;">Description</h6>
        <button type="button" onclick="aiGenerate()" class="btn btn-sm" style="background:linear-gradient(135deg,#667EEA,#764BA2);color:#fff;border:none;border-radius:8px;font-size:.78rem;padding:.3rem .8rem;">
          <span id="aiSpin" class="spinner-border spinner-border-sm me-1" style="display:none;"></span>✨ AI Generate
        </button>
      </div>
      <textarea name="description" id="descField" class="form-control" rows="6"
                placeholder="Describe your listing in detail — condition, history, features, reason for selling…"
                required th:text="${edit ? listing.description : ''}"></textarea>
      <div style="font-size:.75rem;color:var(--text2);margin-top:.3rem;">Tip: Use the AI button to generate a professional description automatically.</div>
    </div>

    <!-- Options -->
    <div style="background:var(--bg3);border-radius:14px;padding:1.5rem;margin-bottom:1.5rem;box-shadow:0 2px 10px rgba(0,0,0,.06);">
      <h6 style="font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--text2);margin-bottom:1rem;">Options</h6>
      <div class="row g-3">
        <div class="col-md-6">
          <div class="form-check form-switch">
            <input class="form-check-input" type="checkbox" name="negotiable" id="negotiable" th:checked="${edit and listing.negotiable}">
            <label class="form-check-label" for="negotiable">💬 Price is Negotiable</label>
          </div>
        </div>
        <div class="col-md-6">
          <div class="form-check form-switch">
            <input class="form-check-input" type="checkbox" name="installmentAvailable" id="installment" th:checked="${edit and listing.installmentAvailable}">
            <label class="form-check-label" for="installment">📆 Installment Available</label>
          </div>
        </div>
      </div>
    </div>

    <button type="submit" class="btn btn-gold btn-lg w-100">
      <i class="fa fa-paper-plane me-2"></i><span th:text="${edit ? 'Update Listing' : 'Submit Listing for Review'}"></span>
    </button>
  </form>
</div>

<script>
let selType='car';
function selectType(t){
  selType=t;
  document.getElementById('carFields').style.display=t==='car'?'':'none';
  document.getElementById('landFields').style.display=t==='land'?'':'none';
  document.getElementById('carCard').style.borderColor=t==='car'?'#C9A84C':'#e5e7eb';
  document.getElementById('landCard').style.borderColor=t==='land'?'#C9A84C':'#e5e7eb';
}

async function aiGenerate(){
  const sp=document.getElementById('aiSpin');sp.style.display='inline-block';
  const title=document.querySelector('[name=title]').value;
  const price=document.querySelector('[name=price]').value;
  const loc=document.querySelector('[name=location]').value||document.querySelector('[name=county]').value;
  let details='';
  if(selType==='car'){
    const make=document.querySelector('[name=make]')?.value||'';
    const model=document.querySelector('[name=model]')?.value||'';
    const year=document.querySelector('[name=year]')?.value||'';
    const km=document.querySelector('[name=mileage]')?.value||'';
    const fuel=document.querySelector('[name=fuelType]')?.value||'';
    details=`${year} ${make} ${model}, ${km}km, ${fuel}, KES ${parseInt(price).toLocaleString()}, ${loc}`;
  } else {
    const acres=document.querySelector('[name=sizeAcres]')?.value||'';
    const zone=document.querySelector('[name=zoning]')?.value||'';
    details=`${acres} acres ${zone} land, KES ${parseInt(price).toLocaleString()}, ${loc}`;
  }
  try{
    const r=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:1000,messages:[{role:'user',
        content:`Write a compelling 3-paragraph marketplace listing description for this ${selType} in Kenya:\nTitle: ${title}\n${details}\nMake it professional and persuasive for Kenyan buyers. Do not include the price or location.`
      }]})
    });
    const d=await r.json();
    document.getElementById('descField').value=d.content?.[0]?.text||'';
  }catch(e){alert('AI generation failed. Please fill description manually.');}
  sp.style.display='none';
}
</script>
</main></body>
</html>

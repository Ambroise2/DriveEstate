<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{client/layout :: layout(~{::title}, ~{::main})}">
<head><title>Messages — DriveEstate</title></head>
<body><main>
<div class="page-hdr"><div class="container-fluid px-4"><h1 style="font-size:1.85rem;">📨 Messages</h1></div></div>
<div class="container-fluid px-4 pb-5">
  <ul class="nav nav-pills mb-4" id="msgTab">
    <li class="nav-item"><button class="nav-link active" data-bs-toggle="pill" data-bs-target="#received">Received (<span th:text="${received.size()}"></span>)</button></li>
    <li class="nav-item"><button class="nav-link" data-bs-toggle="pill" data-bs-target="#sent">Sent (<span th:text="${sent.size()}"></span>)</button></li>
  </ul>
  <div class="tab-content">
    <!-- Received -->
    <div class="tab-pane fade show active" id="received">
      <div th:if="${received.isEmpty()}" class="text-center py-5" style="color:#9CA3AF;"><div style="font-size:3.5rem;">📭</div><p class="mt-2">No messages yet</p></div>
      <div th:each="inq : ${received}" style="background:#fff;border-radius:14px;padding:1.25rem;margin-bottom:1rem;border:1px solid #eee;">
        <div class="d-flex justify-content-between align-items-start">
          <div>
            <div style="font-weight:600;" th:text="${inq.sender.name}"></div>
            <div style="font-size:.8rem;color:#6B7280;">re: <a th:href="@{/listing/{id}(id=${inq.listing.id})}" th:text="${inq.listing.title}" style="color:#C9A84C;text-decoration:none;"></a></div>
          </div>
          <div style="font-size:.75rem;color:#9CA3AF;" th:text="${#temporals.format(inq.createdAt,'dd MMM yyyy')}"></div>
        </div>
        <p style="margin:.75rem 0 .5rem;font-size:.88rem;color:#374151;" th:text="${inq.message}"></p>
        <div th:if="${inq.reply != null}" style="background:#F0FDF4;border-left:3px solid #10B981;padding:.65rem .85rem;border-radius:6px;font-size:.85rem;margin-bottom:.5rem;">
          <strong style="color:#065F46;">Your reply:</strong> <span th:text="${inq.reply}"></span>
        </div>
        <div th:unless="${inq.reply != null}">
          <form method="POST" th:action="@{/inquiry/{id}/reply(id=${inq.id})}" class="d-flex gap-2 mt-2">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <input type="text" name="reply" class="form-control form-control-sm" placeholder="Type your reply…" required>
            <button type="submit" class="btn btn-gold btn-sm px-3">Reply</button>
          </form>
        </div>
      </div>
    </div>
    <!-- Sent -->
    <div class="tab-pane fade" id="sent">
      <div th:if="${sent.isEmpty()}" class="text-center py-5" style="color:#9CA3AF;"><div style="font-size:3.5rem;">📤</div><p class="mt-2">No sent messages</p></div>
      <div th:each="inq : ${sent}" style="background:#fff;border-radius:14px;padding:1.25rem;margin-bottom:1rem;border:1px solid #eee;">
        <div class="d-flex justify-content-between">
          <div>
            <div style="font-weight:600;">To: <span th:text="${inq.receiver.name}"></span></div>
            <div style="font-size:.8rem;color:#6B7280;">re: <a th:href="@{/listing/{id}(id=${inq.listing.id})}" th:text="${inq.listing.title}" style="color:#C9A84C;text-decoration:none;"></a></div>
          </div>
          <div style="font-size:.75rem;color:#9CA3AF;" th:text="${#temporals.format(inq.createdAt,'dd MMM yyyy')}"></div>
        </div>
        <p style="margin:.75rem 0 .25rem;font-size:.88rem;color:#374151;" th:text="${inq.message}"></p>
        <div th:if="${inq.reply != null}" style="background:#EFF6FF;border-left:3px solid #3B82F6;padding:.65rem .85rem;border-radius:6px;font-size:.85rem;margin-top:.5rem;">
          <strong style="color:#1E40AF;">Seller replied:</strong> <span th:text="${inq.reply}"></span>
        </div>
        <div th:unless="${inq.reply != null}" style="font-size:.75rem;color:#9CA3AF;margin-top:.5rem;"><i class="fa fa-clock me-1"></i>Awaiting reply</div>
      </div>
    </div>
  </div>
</div>
</main></body>
</html>

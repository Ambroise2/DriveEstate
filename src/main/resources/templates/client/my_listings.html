<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{client/layout :: layout(~{::title}, ~{::main})}">
<head><title>My Listings — DriveEstate</title></head>
<body><main>
<div class="page-hdr"><div class="container-fluid px-4 d-flex justify-content-between align-items-center">
  <h1 style="font-size:1.85rem;">My Listings</h1>
  <a th:href="@{/post-listing}" class="btn btn-gold btn-sm"><i class="fa fa-plus me-1"></i>Post New</a>
</div></div>
<div class="container-fluid px-4 pb-5">
  <!-- Filter Tabs -->
  <div class="d-flex gap-2 mb-3 flex-wrap">
    <a th:each="s : ${ {{'','All'},{'ACTIVE','Active'},{'PENDING','Pending'},{'REJECTED','Rejected'},{'SOLD','Sold'}} }"
       th:href="@{/my-listings(status=${s[0]})}"
       th:classappend="${statusFilter == s[0] or (statusFilter == null and s[0] == '')} ? 'btn-gold' : 'btn-outline-secondary'"
       class="btn btn-sm" th:text="${s[1]}"></a>
  </div>
  <div th:if="${listings.isEmpty()}" class="text-center py-5">
    <div style="font-size:4rem;">📋</div><h5 class="mt-2">No listings found</h5>
    <a th:href="@{/post-listing}" class="btn btn-gold mt-2">Post Your First Listing</a>
  </div>
  <div th:unless="${listings.isEmpty()}" class="row g-3">
    <div class="col-sm-6 col-lg-4" th:each="l : ${listings}">
      <div class="card-listing">
        <div class="card-img" style="height:160px;">
          <span th:text="${l.listingType.name() == 'CAR' ? '🚗' : '🌍'}"></span>
          <span class="position-absolute badge px-2 py-1" style="top:8px;left:8px;border-radius:20px;font-size:.65rem;"
                th:text="${l.status}"
                th:style="${l.status.name() == 'ACTIVE'} ? 'background:#ECFDF5;color:#065F46;' : (${l.status.name() == 'PENDING'} ? 'background:#FFF7ED;color:#9A3412;' : 'background:#FEF2F2;color:#991B1B;')"></span>
        </div>
        <div style="padding:1rem;">
          <div style="font-weight:600;font-size:.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;" th:text="${l.title}"></div>
          <div class="price" th:text="${l.formattedPrice}"></div>
          <div style="font-size:.78rem;color:var(--text2);margin-top:.25rem;"><i class="fa fa-eye me-1"></i><span th:text="${l.views}"></span> views · <i class="fa fa-comment ms-1 me-1"></i><span th:text="${l.totalInquiries}"></span> inquiries</div>
          <div class="d-flex gap-2 mt-2">
            <a th:href="@{/listing/{id}(id=${l.id})}" class="btn btn-sm btn-outline-secondary flex-fill">View</a>
            <a th:href="@{/listing/{id}/edit(id=${l.id})}" class="btn btn-sm btn-gold flex-fill">Edit</a>
          </div>
          <form th:action="@{/listing/{id}/delete(id=${l.id})}" method="POST" class="mt-1" onsubmit="return confirm('Delete this listing?')">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <button type="submit" class="btn btn-sm btn-outline-danger w-100" style="font-size:.75rem;">Delete</button>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
</main></body>
</html>

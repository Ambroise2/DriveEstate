<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{client/layout :: layout(~{::title}, ~{::main})}">
<head><title th:text="${seller.name + ' — DriveEstate'}">Seller — DriveEstate</title></head>
<body><main>
<div class="page-hdr"><div class="container-fluid px-4"><h1 style="font-size:1.85rem;">Seller Profile</h1></div></div>
<div class="container-fluid px-4 pb-5">
  <div class="row g-4">
    <div class="col-lg-3">
      <div style="background:var(--bg3);border-radius:16px;padding:1.75rem;text-align:center;box-shadow:0 2px 12px rgba(0,0,0,.08);position:sticky;top:75px;">
        <div style="width:72px;height:72px;border-radius:50%;background:linear-gradient(135deg,#C9A84C,#E8C97A);display:flex;align-items:center;justify-content:center;font-size:2rem;font-weight:700;color:#0A1628;margin:0 auto .75rem;" th:text="${seller.initial}"></div>
        <h5 style="font-weight:700;" th:text="${seller.name}"></h5>
        <div style="font-size:.82rem;color:var(--text2);" th:text="${seller.county}"></div>
        <span th:if="${seller.verified}" class="badge mt-1" style="background:#ECFDF5;color:#065F46;border:1px solid #A7F3D0;font-size:.7rem;">✓ Verified Seller</span>
        <div style="font-size:.78rem;color:var(--text2);margin-top:.75rem;">Member since <span th:text="${#temporals.format(seller.createdAt,'MMM yyyy')}"></span></div>
        <hr>
        <div style="font-size:.85rem;color:var(--text);font-style:italic;" th:text="${seller.bio ?: 'DriveEstate seller'}"></div>
        <div class="mt-3">
          <a th:href="'tel:' + ${seller.phone}" class="btn btn-gold btn-sm w-100 mb-2"><i class="fa fa-phone me-1"></i>Call Seller</a>
          <a th:href="'https://wa.me/' + ${#strings.replace(seller.phone,'+','')}" target="_blank"
             class="btn btn-sm w-100" style="background:#25D366;color:#fff;border:none;border-radius:8px;font-weight:600;"><i class="fab fa-whatsapp me-1"></i>WhatsApp</a>
        </div>
      </div>
    </div>
    <div class="col-lg-9">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h5 style="font-weight:700;margin:0;" th:text="${listings.size() + ' Active Listings'}"></h5>
      </div>
      <div th:if="${listings.isEmpty()}" class="text-center py-5" style="color:var(--text2);"><div style="font-size:3rem;">📋</div><p>No active listings</p></div>
      <div class="row g-3" th:unless="${listings.isEmpty()}">
        <div class="col-sm-6 col-lg-4" th:each="l : ${listings}">
          <div class="card-listing">
            <div class="card-img" style="height:155px;"><span th:text="${l.listingType.name() == 'CAR' ? '🚗' : '🌍'}"></span></div>
            <div style="padding:.9rem;">
              <div style="font-weight:600;font-size:.88rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;" th:text="${l.title}"></div>
              <div class="price" style="font-size:1rem;" th:text="${l.formattedPrice}"></div>
              <div style="font-size:.75rem;color:var(--text2);margin-top:.2rem;"><i class="fa fa-map-marker-alt me-1" style="color:#C9A84C;"></i><span th:text="${l.location}"></span></div>
              <a th:href="@{/listing/{id}(id=${l.id})}" class="btn btn-gold btn-sm w-100 mt-2">View Details</a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
</main></body>
</html>

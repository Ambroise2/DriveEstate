<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      th:fragment="adminLayout(title, content)">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta th:name="_csrf" th:content="${_csrf.token}"/>
<title>Admin — DriveEstate</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --gold: #C9A84C;
  --gold-light: #E8C97A;
  --gold-dim: rgba(201,168,76,.15);
  --navy: #0A1628;
  --navy-2: #111E35;
  --navy-3: #192847;
  --navy-4: #1E3160;
  --sidebar-w: 260px;
  --text: #E2E8F0;
  --text-dim: #94A3B8;
  --border: rgba(255,255,255,.07);
  --card-bg: #131F38;
  --success: #10B981;
  --danger: #EF4444;
  --warning: #F59E0B;
  --info: #3B82F6;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Inter', sans-serif; background: var(--navy); color: var(--text); display: flex; min-height: 100vh; }

/* ── Sidebar ── */
.sidebar {
  width: var(--sidebar-w);
  background: var(--navy-2);
  border-right: 1px solid var(--border);
  position: fixed; top: 0; left: 0; bottom: 0;
  overflow-y: auto; z-index: 100;
  display: flex; flex-direction: column;
}
.sidebar::-webkit-scrollbar { width: 3px; }
.sidebar::-webkit-scrollbar-thumb { background: var(--gold-dim); border-radius: 2px; }

.brand {
  padding: 1.5rem 1.25rem 1rem;
  border-bottom: 1px solid var(--border);
}
.brand-name {
  font-family: 'Cormorant Garamond', serif;
  font-size: 1.6rem; font-weight: 700;
  background: linear-gradient(135deg, var(--gold), #F0D98C, var(--gold));
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  letter-spacing: -.5px;
}
.brand-tag {
  font-size: .65rem; font-weight: 500; letter-spacing: 2px;
  text-transform: uppercase; color: var(--text-dim); margin-top: 2px;
}
.brand-badge {
  display: inline-block; margin-top: .5rem;
  background: var(--gold-dim); border: 1px solid rgba(201,168,76,.3);
  color: var(--gold); font-size: .6rem; font-weight: 700;
  letter-spacing: 1px; padding: .2rem .6rem; border-radius: 20px;
  text-transform: uppercase;
}

.sidebar-section {
  font-size: .6rem; font-weight: 700; text-transform: uppercase;
  letter-spacing: 2px; color: var(--text-dim);
  padding: 1.25rem 1.25rem .4rem; opacity: .5;
}

.nav-item {
  display: flex; align-items: center; gap: .75rem;
  padding: .65rem 1.25rem;
  color: var(--text-dim); font-size: .82rem; font-weight: 500;
  text-decoration: none;
  border-left: 3px solid transparent;
  transition: all .2s; border-radius: 0;
  position: relative;
}
.nav-item:hover {
  color: var(--text);
  background: rgba(255,255,255,.04);
  border-left-color: rgba(201,168,76,.4);
}
.nav-item.active {
  color: var(--gold);
  background: var(--gold-dim);
  border-left-color: var(--gold);
  font-weight: 600;
}
.nav-item i { width: 18px; text-align: center; font-size: .85rem; }
.nav-badge {
  margin-left: auto; background: var(--danger);
  color: #fff; font-size: .6rem; font-weight: 700;
  padding: .15rem .45rem; border-radius: 10px;
  animation: pulse 2s infinite;
}
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.6} }

.sidebar-bottom {
  margin-top: auto;
  border-top: 1px solid var(--border);
  padding: .75rem 0;
}

/* ── Main ── */
.main-content {
  margin-left: var(--sidebar-w);
  flex: 1; display: flex; flex-direction: column; min-height: 100vh;
}

.topbar {
  background: var(--navy-2);
  border-bottom: 1px solid var(--border);
  padding: 1rem 2rem;
  display: flex; align-items: center; justify-content: space-between;
  position: sticky; top: 0; z-index: 50;
  backdrop-filter: blur(10px);
}
.topbar-title {
  font-size: 1.05rem; font-weight: 700; color: var(--text);
}
.topbar-right { display: flex; align-items: center; gap: 1rem; }
.admin-pill {
  display: flex; align-items: center; gap: .5rem;
  background: var(--gold-dim); border: 1px solid rgba(201,168,76,.25);
  border-radius: 20px; padding: .35rem .9rem;
  font-size: .78rem; font-weight: 600; color: var(--gold);
}
.admin-pill .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--success); }
.btn-view-site {
  background: var(--gold); color: var(--navy);
  border: none; border-radius: 8px;
  padding: .4rem 1rem; font-size: .78rem; font-weight: 700;
  text-decoration: none; transition: all .2s;
}
.btn-view-site:hover { background: var(--gold-light); color: var(--navy); transform: translateY(-1px); }

.page-body { padding: 2rem; flex: 1; }

/* ── Stat Cards ── */
.stat-card {
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: 16px; padding: 1.5rem;
  position: relative; overflow: hidden;
  transition: transform .2s, border-color .2s;
}
.stat-card:hover { transform: translateY(-2px); border-color: rgba(201,168,76,.25); }
.stat-card::before {
  content: ''; position: absolute;
  top: 0; right: 0; width: 80px; height: 80px;
  border-radius: 0 16px 0 80px;
  opacity: .06;
}
.stat-card.blue::before   { background: var(--info); }
.stat-card.green::before  { background: var(--success); }
.stat-card.amber::before  { background: var(--warning); }
.stat-card.purple::before { background: #8B5CF6; }
.stat-card.gold::before   { background: var(--gold); }
.stat-card.teal::before   { background: #14B8A6; }
.stat-card.red::before    { background: var(--danger); }
.stat-card.sky::before    { background: #0EA5E9; }

.stat-icon {
  width: 44px; height: 44px; border-radius: 12px;
  display: flex; align-items: center; justify-content: center;
  font-size: 1.2rem; margin-bottom: 1rem;
}
.stat-icon.blue   { background: rgba(59,130,246,.15); color: var(--info); }
.stat-icon.green  { background: rgba(16,185,129,.15); color: var(--success); }
.stat-icon.amber  { background: rgba(245,158,11,.15); color: var(--warning); }
.stat-icon.purple { background: rgba(139,92,246,.15); color: #8B5CF6; }
.stat-icon.gold   { background: var(--gold-dim); color: var(--gold); }
.stat-icon.teal   { background: rgba(20,184,166,.15); color: #14B8A6; }
.stat-icon.red    { background: rgba(239,68,68,.15); color: var(--danger); }
.stat-icon.sky    { background: rgba(14,165,233,.15); color: #0EA5E9; }

.stat-value {
  font-family: 'Cormorant Garamond', serif;
  font-size: 2.4rem; font-weight: 700; line-height: 1;
  color: var(--text); margin-bottom: .25rem;
}
.stat-label { font-size: .75rem; color: var(--text-dim); font-weight: 500; text-transform: uppercase; letter-spacing: .5px; }
.stat-trend { font-size: .7rem; margin-top: .5rem; }
.stat-trend.up { color: var(--success); }
.stat-trend.neutral { color: var(--text-dim); }

/* ── Card Box ── */
.card-box {
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: 16px; padding: 1.5rem;
}
.card-box-title {
  font-size: .85rem; font-weight: 700;
  color: var(--text); margin-bottom: 1.25rem;
  display: flex; align-items: center; justify-content: space-between;
}
.card-box-title a { font-size: .72rem; color: var(--gold); text-decoration: none; font-weight: 500; }
.card-box-title a:hover { color: var(--gold-light); }

/* ── Table ── */
.table { --bs-table-bg: transparent; --bs-table-color: var(--text); }
.table th {
  font-size: .68rem; font-weight: 700; text-transform: uppercase;
  letter-spacing: .8px; color: var(--text-dim);
  border-bottom: 1px solid var(--border) !important; padding-bottom: .75rem;
}
.table td { font-size: .82rem; vertical-align: middle; border-color: var(--border); color: var(--text); }
.table tbody tr { transition: background .15s; }
.table tbody tr:hover { background: rgba(255,255,255,.03); }

/* ── Badges ── */
.badge-active   { background: rgba(16,185,129,.15); color: #34D399; border: 1px solid rgba(16,185,129,.25); }
.badge-pending  { background: rgba(245,158,11,.15); color: #FCD34D; border: 1px solid rgba(245,158,11,.25); }
.badge-rejected { background: rgba(239,68,68,.15); color: #FCA5A5; border: 1px solid rgba(239,68,68,.25); }
.badge-sold     { background: rgba(139,92,246,.15); color: #C4B5FD; border: 1px solid rgba(139,92,246,.25); }
.badge-verified { background: rgba(14,165,233,.15); color: #7DD3FC; border: 1px solid rgba(14,165,233,.25); }
.badge-car      { background: var(--gold-dim); color: var(--gold); border: 1px solid rgba(201,168,76,.25); }
.badge-land     { background: rgba(20,184,166,.15); color: #5EEAD4; border: 1px solid rgba(20,184,166,.25); }

.status-badge {
  font-size: .65rem; font-weight: 700; text-transform: uppercase;
  letter-spacing: .5px; padding: .25rem .65rem; border-radius: 20px;
}

/* ── Buttons ── */
.btn-gold { background: var(--gold); color: var(--navy); border: none; font-weight: 700; border-radius: 10px; transition: all .2s; }
.btn-gold:hover { background: var(--gold-light); color: var(--navy); transform: translateY(-1px); box-shadow: 0 4px 15px rgba(201,168,76,.3); }
.btn-outline-gold { background: transparent; color: var(--gold); border: 1px solid rgba(201,168,76,.4); font-weight: 600; border-radius: 10px; transition: all .2s; }
.btn-outline-gold:hover { background: var(--gold-dim); color: var(--gold); border-color: var(--gold); }

/* ── Forms ── */
.form-control, .form-select {
  background: var(--navy-3) !important; border: 1px solid var(--border) !important;
  color: var(--text) !important; border-radius: 10px;
}
.form-control:focus, .form-select:focus {
  border-color: rgba(201,168,76,.5) !important;
  box-shadow: 0 0 0 3px rgba(201,168,76,.1) !important;
}
.form-control::placeholder { color: var(--text-dim) !important; }
.form-label { color: var(--text-dim); font-size: .8rem; font-weight: 600; }

/* ── Alert ── */
.alert-success { background: rgba(16,185,129,.1); border: 1px solid rgba(16,185,129,.2); color: #34D399; border-radius: 12px; }
.alert-danger  { background: rgba(239,68,68,.1); border: 1px solid rgba(239,68,68,.2); color: #FCA5A5; border-radius: 12px; }
.btn-close { filter: invert(1) opacity(.5); }

/* ── Nav pills (tabs) ── */
.nav-pills .nav-link {
  background: var(--navy-3); color: var(--text-dim);
  border: 1px solid var(--border); border-radius: 10px;
  font-size: .8rem; font-weight: 600; transition: all .2s;
}
.nav-pills .nav-link.active {
  background: var(--gold-dim) !important;
  color: var(--gold) !important;
  border-color: rgba(201,168,76,.4) !important;
}
.nav-pills .nav-link:hover:not(.active) { background: rgba(255,255,255,.05); color: var(--text); }

/* ── Divider ── */
hr { border-color: var(--border); }

/* ── Scrollbar ── */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: var(--navy-2); }
::-webkit-scrollbar-thumb { background: var(--navy-4); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--gold-dim); }
</style>
</head>
<body>

<!-- ── Sidebar ─────────────────────────────────────────────────────────── -->
<aside class="sidebar">
  <div class="brand">
    <div class="brand-name">DriveEstate</div>
    <div class="brand-tag">Control Panel</div>
    <div class="brand-badge">⚡ Admin</div>
  </div>

  <div class="sidebar-section">Overview</div>
  <a th:href="@{/admin/dashboard}" class="nav-item active">
    <i class="fa fa-chart-line"></i> Dashboard
  </a>

  <div class="sidebar-section">Management</div>
  <a th:href="@{/admin/users}"    class="nav-item"><i class="fa fa-users"></i> Users</a>
  <a th:href="@{/admin/listings}" class="nav-item"><i class="fa fa-list"></i> All Listings</a>
  <a th:href="@{/admin/listings(status=PENDING)}" class="nav-item">
    <i class="fa fa-clock"></i> Pending Review
    <span class="nav-badge">!</span>
  </a>
  <a th:href="@{/admin/inquiries}" class="nav-item"><i class="fa fa-envelope"></i> Inquiries</a>

  <div class="sidebar-section">Analytics</div>
  <a th:href="@{/admin/reports}" class="nav-item"><i class="fa fa-chart-bar"></i> Reports</a>
  <a th:href="@{/admin/logs}"    class="nav-item"><i class="fa fa-history"></i> Activity Logs</a>

  <div class="sidebar-section">System</div>
  <a th:href="@{/admin/settings}"  class="nav-item"><i class="fa fa-cog"></i> Settings</a>
  <a th:href="@{/h2-console}" target="_blank" class="nav-item"><i class="fa fa-database"></i> Database</a>

  <div class="sidebar-bottom">
    <a th:href="@{/}"            class="nav-item"><i class="fa fa-arrow-left"></i> View Site</a>
    <a th:href="@{/auth/logout}" class="nav-item" style="color:rgba(239,68,68,.7)"><i class="fa fa-sign-out-alt"></i> Logout</a>
  </div>
</aside>

<!-- ── Main Content ──────────────────────────────────────────────────────── -->
<div class="main-content">
  <div class="topbar">
    <div class="topbar-title">Admin Panel</div>
    <div class="topbar-right">
      <div class="admin-pill"><span class="dot"></span> Admin Online</div>
      <a th:href="@{/}" class="btn-view-site"><i class="fa fa-external-link-alt me-1"></i> View Site</a>
    </div>
  </div>

  <div th:if="${success != null}" class="mx-4 mt-3">
    <div class="alert alert-success alert-dismissible fade show py-2" th:text="${success}">
      <button type="button" class="btn-close btn-sm" data-bs-dismiss="alert"></button>
    </div>
  </div>
  <div th:if="${error != null}" class="mx-4 mt-3">
    <div class="alert alert-danger alert-dismissible fade show py-2" th:text="${error}">
      <button type="button" class="btn-close btn-sm" data-bs-dismiss="alert"></button>
    </div>
  </div>

  <div class="page-body" th:replace="${content}">Loading...</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{admin/layout :: adminLayout(~{::title}, ~{::section})}">
<head><title>Listings — Admin</title></head>
<body><section>
<div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
  <h5 style="font-weight:700;margin:0;">All Listings <span style="color:#9CA3AF;font-size:.85rem;" th:text="'(' + ${totalItems} + ')'"></span></h5>
  <form method="GET" th:action="@{/admin/listings}" class="d-flex gap-2 flex-wrap">
    <select name="status" class="form-select form-select-sm" onchange="this.form.submit()" style="width:130px;">
      <option value="" th:selected="${statusFilter == null}">All Status</option>
      <option th:each="s : ${ {'PENDING','ACTIVE','REJECTED','SOLD'} }" th:value="${s}" th:text="${s}" th:selected="${statusFilter == s}"></option>
    </select>
    <select name="type" class="form-select form-select-sm" onchange="this.form.submit()" style="width:110px;">
      <option value="" th:selected="${typeFilter == null}">All Types</option>
      <option value="car" th:selected="${typeFilter == 'car'}">🚗 Cars</option>
      <option value="land" th:selected="${typeFilter == 'land'}">🌍 Land</option>
    </select>
    <input type="text" name="q" class="form-control form-control-sm" placeholder="Search…" th:value="${q}" style="width:180px;">
    <button type="submit" class="btn btn-gold btn-sm">Go</button>
  </form>
</div>
<div class="card-box">
  <div class="table-responsive">
    <table class="table table-hover mb-0">
      <thead><tr><th>Listing</th><th>Type</th><th>Price</th><th>Status</th><th>Views</th><th>Seller</th><th>Date</th><th>Actions</th></tr></thead>
      <tbody>
        <tr th:each="l : ${listings}">
          <td>
            <div style="font-weight:600;font-size:.84rem;" th:text="${#strings.abbreviate(l.title,42)}"></div>
            <div style="font-size:.72rem;color:#9CA3AF;" th:text="${l.location}"></div>
          </td>
          <td th:text="${l.listingType.name() == 'CAR' ? '🚗 Car' : '🌍 Land'}"></td>
          <td style="font-weight:600;color:#C9A84C;font-size:.85rem;" th:text="${l.formattedPrice}"></td>
          <td>
            <span class="badge px-2 py-1" th:text="${l.status}"
                  th:style="${l.status.name() == 'ACTIVE'} ? 'background:#ECFDF5;color:#065F46;' : (${l.status.name() == 'PENDING'} ? 'background:#FFF7ED;color:#9A3412;' : (${l.status.name() == 'SOLD'} ? 'background:#F3F4F6;color:#374151;' : 'background:#FEF2F2;color:#991B1B;'))"></span>
          </td>
          <td style="font-size:.82rem;" th:text="${l.views}"></td>
          <td style="font-size:.82rem;" th:text="${l.seller.name}"></td>
          <td style="font-size:.78rem;color:#9CA3AF;" th:text="${#temporals.format(l.createdAt,'dd MMM yyyy')}"></td>
          <td>
            <a th:href="@{/admin/listings/{id}(id=${l.id})}" class="btn btn-sm btn-outline-secondary" style="font-size:.72rem;">Manage</a>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
  <!-- Pagination -->
  <nav th:if="${totalPages > 1}" class="mt-3">
    <ul class="pagination pagination-sm justify-content-center mb-0">
      <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
        <a class="page-link" th:href="@{/admin/listings(page=${currentPage - 1})}">‹</a>
      </li>
      <li th:each="i : ${#numbers.sequence(0, totalPages - 1)}" class="page-item" th:classappend="${i == currentPage} ? 'active'">
        <a class="page-link" th:href="@{/admin/listings(page=${i})}" th:text="${i + 1}"></a>
      </li>
      <li class="page-item" th:classappend="${currentPage == totalPages - 1} ? 'disabled'">
        <a class="page-link" th:href="@{/admin/listings(page=${currentPage + 1})}">›</a>
      </li>
    </ul>
  </nav>
</div>
</section></body>
</html>

<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{admin/layout :: adminLayout(~{::title}, ~{::section})}">
<head><title>Activity Logs — Admin</title></head>
<body><section>
<h5 style="font-weight:700;margin-bottom:1.25rem;">📋 Activity Logs</h5>
<div class="card-box">
  <div class="table-responsive">
    <table class="table table-hover mb-0">
      <thead><tr><th>User</th><th>Action</th><th>Details</th><th>IP</th><th>Time</th></tr></thead>
      <tbody>
        <tr th:each="log : ${logs}">
          <td style="font-size:.82rem;font-weight:600;" th:text="${log.userName ?: 'Unknown'}"></td>
          <td><span class="badge" style="background:#EFF6FF;color:#1E40AF;font-size:.72rem;" th:text="${log.action}"></span></td>
          <td style="font-size:.78rem;color:#6B7280;" th:text="${#strings.abbreviate(log.details ?: '', 50)}"></td>
          <td style="font-size:.75rem;color:#9CA3AF;font-family:monospace;" th:text="${log.ipAddress ?: '—'}"></td>
          <td style="font-size:.75rem;color:#9CA3AF;" th:text="${#temporals.format(log.createdAt,'dd MMM HH:mm')}"></td>
        </tr>
      </tbody>
    </table>
  </div>
  <nav th:if="${totalPages > 1}" class="mt-3">
    <ul class="pagination pagination-sm justify-content-center mb-0">
      <li class="page-item" th:classappend="${currentPage==0}?'disabled'"><a class="page-link" th:href="@{/admin/logs(page=${currentPage-1})}">‹</a></li>
      <li th:each="i : ${#numbers.sequence(0,totalPages-1)}" class="page-item" th:classappend="${i==currentPage}?'active'"><a class="page-link" th:href="@{/admin/logs(page=${i})}" th:text="${i+1}"></a></li>
      <li class="page-item" th:classappend="${currentPage==totalPages-1}?'disabled'"><a class="page-link" th:href="@{/admin/logs(page=${currentPage+1})}">›</a></li>
    </ul>
  </nav>
</div>
</section></body>
</html>
